# dispatcher-go verb catalog (schema v1)
# Adding a verb = edit this file and restart the daemon (see ADR-0004).
version: 1
daemon:
  listen: "127.0.0.1:8477"
  task_timeout_s: 30
  max_retries: 5          # total attempts = 1 + max_retries (attempts index 0..max_retries)
  backoff_base_s: 1       # delay after failure n = base * 2^n + jitter(<=250ms); n = attempt index of failed try
  cb_trip_threshold: 5
  cb_open_s: 60
  max_queue_depth: 1024
  stream_buffer_default: 128

verbs:
  # --- Tier A perceive ---
  - name: battery.status
    tier: A
    argv: ["termux-battery-status"]
    parser: json
    watch: false

  - name: camera.info
    tier: A
    argv: ["termux-camera-info"]
    parser: json
    watch: false

  - name: audio.info
    tier: A
    argv: ["termux-audio-info"]
    parser: json
    watch: false

  - name: wifi.info
    tier: A
    argv: ["termux-wifi-connectioninfo"]
    parser: json
    watch: false

  - name: wifi.scan-one-shot
    tier: A
    argv: ["termux-wifi-scaninfo"]
    parser: json
    watch: false

  - name: telephony.cell
    tier: A
    argv: ["termux-telephony-cellinfo"]
    parser: json
    watch: false

  - name: telephony.device
    tier: A
    argv: ["termux-telephony-deviceinfo"]
    parser: json
    watch: false

  - name: clipboard.get
    tier: A
    argv: ["termux-clipboard-get"]
    parser: text
    watch: false

  - name: contacts.list
    tier: A
    argv: ["termux-contact-list"]
    parser: json
    watch: false

  - name: call-log.read
    tier: A
    argv: ["termux-call-log"]
    args:
      - {name: limit, flag: -l, type: int, required: false}
    parser: json
    watch: false

  - name: sms.read
    tier: A
    argv: ["termux-sms-list"]
    parser: json
    watch: false

  - name: sensor.list
    tier: A
    argv: ["termux-sensor", "-l"]
    parser: json
    watch: false

  - name: location.once
    tier: A
    argv: ["termux-location", "-p", "{{.provider}}", "-r", "{{.request}}"]
    args:
      - {name: provider, flag: -p, type: string, required: false}
      - {name: request, flag: -r, type: string, required: false}
    parser: json
    watch: false

  - name: volume.info
    tier: A
    argv: ["termux-volume"]
    parser: text
    watch: false

  - name: tts.engines
    tier: A
    argv: ["termux-tts-engines"]
    parser: json
    watch: false

  - name: notification.list
    tier: A
    argv: ["termux-notification-list"]
    parser: json
    watch: false

  - name: infrared.frequencies
    tier: A
    argv: ["termux-infrared-frequencies"]
    parser: json
    watch: false

  # --- Tier B act (seed; full set expands in M7) ---
  - name: clipboard.set
    tier: B
    argv: ["termux-clipboard-set"]
    stdin_arg: {arg: text}
    parser: exit
    watch: false

  - name: sms.send
    tier: B
    argv: ["termux-sms-send", "-n", "{{.number}}"]
    args:
      - {name: number, flag: -n, type: string, required: true}
    stdin_arg: {arg: text}
    timeout_s: 30
    parser: exit
    watch: false

  - name: telephony.call
    tier: B
    argv: ["termux-telephony-call", "{{.number}}"]
    args:
      - {name: number, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: toast.show
    tier: B
    argv: ["termux-toast", "{{.text}}"]
    parser: exit
    watch: false

  - name: notification.send
    tier: B
    argv: ["termux-notification", "-t", "{{.title}}", "-c", "{{.content}}"]
    parser: exit
    watch: false

  - name: vibrate
    tier: B
    argv: ["termux-vibrate"]
    args:
      - {name: duration_ms, flag: -d, type: int, required: false}
    parser: exit
    watch: false

  # --- Tier B watch ---
  - name: location.stream
    tier: B
    argv: ["termux-location", "-p", "{{.provider}}", "-r", "updates"]
    args:
      - {name: provider, flag: -p, type: string, required: false}
    watch:
      mode: stream
      buffer: 128
    parser: json

  - name: sensor.stream
    tier: B
    argv: ["termux-sensor", "-s", "{{.sensor}}"]
    args:
      - {name: sensor, flag: -s, type: string, required: false}
    watch:
      mode: stream
      buffer: 128
    parser: json

  # microphone-record is a bounded one-shot capture (task), not a watch stream — ADR-0005
  - name: microphone.record
    tier: B
    argv: ["termux-microphone-record", "-f", "{{.file}}"]
    args:
      - {name: file, flag: -f, type: string, required: true}
      - {name: limit_s, flag: -l, type: int, required: false}
    parser: exit
    watch: false

  - name: camera.photo
    tier: B
    argv: ["termux-camera-photo", "-c", "{{.camera}}", "{{.file}}"]
    args:
      - {name: camera, flag: -c, type: int, required: false}
      - {name: file, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: tts.speak
    tier: B
    argv: ["termux-tts-speak", "{{.text}}"]
    args:
      - {name: text, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: media.play
    tier: B
    argv: ["termux-media-player", "play", "-f", "{{.file}}"]
    args:
      - {name: file, flag: -f, type: string, required: true}
    parser: exit
    watch: false

  - name: brightness.set
    tier: B
    argv: ["termux-brightness", "{{.level}}"]
    args:
      - {name: level, flag: "", type: int, required: true}
    parser: exit
    watch: false

  - name: torch
    tier: B
    argv: ["termux-torch", "{{.state}}"]
    args:
      - {name: state, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: open.url
    tier: B
    argv: ["termux-open", "{{.url}}"]
    args:
      - {name: url, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: share
    tier: B
    argv: ["termux-share", "{{.file}}"]
    args:
      - {name: file, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: download.file
    tier: B
    argv: ["termux-download", "{{.url}}"]
    args:
      - {name: url, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: notification.remove
    tier: B
    argv: ["termux-notification-remove", "{{.id}}"]
    args:
      - {name: id, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: volume.set
    tier: B
    argv: ["termux-volume", "{{.stream}}", "{{.level}}"]
    args:
      - {name: stream, flag: "", type: string, required: true}
      - {name: level, flag: "", type: int, required: true}
    parser: exit
    watch: false

  - name: wallpaper.set
    tier: B
    argv: ["termux-wallpaper", "-f", "{{.file}}"]
    args:
      - {name: file, flag: -f, type: string, required: true}
    parser: exit
    watch: false

  - name: fingerprint.auth
    tier: B
    argv: ["termux-fingerprint"]
    parser: json
    watch: false

  - name: infrared.transmit
    tier: B
    argv: ["termux-infrared-transmit", "-f", "{{.frequency}}"]
    args:
      - {name: frequency, flag: -f, type: string, required: true}
    parser: exit
    watch: false

  - name: saf.ls
    tier: A
    argv: ["termux-saf-ls"]
    parser: json
    watch: false

  - name: saf.stat
    tier: A
    argv: ["termux-saf-stat"]
    parser: json
    watch: false

  - name: saf.dirs
    tier: A
    argv: ["termux-saf-dirs"]
    parser: json
    watch: false

  - name: nfc.list
    tier: A
    argv: ["termux-nfc", "-r"]
    parser: json
    watch: false

  - name: usb.list
    tier: A
    argv: ["termux-usb", "-l"]
    parser: text
    watch: false

  # --- M8 coverage: remaining termux-api surface ---
  - name: sensor.read
    tier: A
    argv: ["termux-sensor", "-s", "{{.sensor}}", "-n", "{{.count}}"]
    args:
      - {name: sensor, flag: -s, type: string, required: true}
      - {name: count, flag: -n, type: int, required: false}
    timeout_s: 60
    parser: json
    watch: false

  - name: saf.read
    tier: A
    argv: ["termux-saf-read", "{{.uri}}"]
    args:
      - {name: uri, flag: "", type: string, required: true}
    parser: text
    watch: false

  - name: wifi.enable
    tier: B
    argv: ["termux-wifi-enable", "{{.enabled}}"]
    args:
      - {name: enabled, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: keystore.list
    tier: B
    argv: ["termux-keystore", "list"]
    parser: text
    watch: false

  - name: keystore.generate
    tier: B
    argv: ["termux-keystore", "generate", "{{.alias}}", "{{.size}}"]
    args:
      - {name: alias, flag: "", type: string, required: true}
      - {name: size, flag: "", type: int, required: false}
    parser: text
    watch: false

  - name: keystore.delete
    tier: B
    argv: ["termux-keystore", "delete", "{{.alias}}"]
    args:
      - {name: alias, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: keystore.sign
    tier: B
    argv: ["termux-keystore", "sign", "{{.alias}}"]
    stdin_arg: {arg: data}
    parser: text
    watch: false

  - name: keystore.verify
    tier: B
    argv: ["termux-keystore", "verify", "{{.alias}}"]
    stdin_arg: {arg: data}
    parser: text
    watch: false

  - name: notification.channel
    tier: B
    argv: ["termux-notification-channel", "{{.op}}", "{{.name}}"]
    args:
      - {name: op, flag: "", type: string, required: true}
      - {name: name, flag: "", type: string, required: false}
    parser: exit
    watch: false

  - name: media.pause
    tier: B
    argv: ["termux-media-player", "pause"]
    parser: exit
    watch: false

  - name: media.stop
    tier: B
    argv: ["termux-media-player", "stop"]
    parser: exit
    watch: false

  - name: media.scan
    tier: B
    argv: ["termux-media-scan", "{{.path}}"]
    args:
      - {name: path, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: stt.listen
    tier: B
    argv: ["termux-speech-to-text"]
    timeout_s: 120
    parser: json
    watch: false

  - name: storage.get
    tier: B
    argv: ["termux-storage-get", "-f", "{{.file}}"]
    args:
      - {name: file, flag: -f, type: string, required: false}
    timeout_s: 300
    parser: exit
    watch: false

  - name: saf.create
    tier: B
    argv: ["termux-saf-create", "{{.name}}"]
    args:
      - {name: name, flag: "", type: string, required: true}
    parser: text
    watch: false

  - name: saf.write
    tier: B
    argv: ["termux-saf-write", "{{.uri}}"]
    stdin_arg: {arg: content}
    parser: exit
    watch: false

  - name: saf.rm
    tier: B
    argv: ["termux-saf-rm", "{{.uri}}"]
    args:
      - {name: uri, flag: "", type: string, required: true}
    parser: exit
    watch: false

  - name: saf.mkdir
    tier: B
    argv: ["termux-saf-mkdir", "{{.name}}"]
    args:
      - {name: name, flag: "", type: string, required: true}
    parser: text
    watch: false

  - name: saf.managedir
    tier: B
    argv: ["termux-saf-managedir"]
    parser: text
    watch: false

  - name: job.schedule
    tier: B
    argv: ["termux-job-scheduler", "-j", "{{.job_id}}", "--period-ms", "{{.period_ms}}", "-s"]
    args:
      - {name: job_id, flag: -j, type: string, required: true}
      - {name: period_ms, flag: -p, type: int, required: true}
    parser: exit
    watch: false

  - name: job.cancel
    tier: B
    argv: ["termux-job-scheduler", "--cancel", "-j", "{{.job_id}}"]
    args:
      - {name: job_id, flag: -j, type: string, required: true}
    parser: exit
    watch: false

  - name: nfc.write
    tier: B
    argv: ["termux-nfc", "-w"]
    stdin_arg: {arg: payload}
    parser: json
    watch: false

  # --- dialog widgets (agent-invoked termux-dialog verbs) ---
  - name: dialog.confirm
    tier: B
    argv: ["termux-dialog", "confirm", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.text
    tier: B
    argv: ["termux-dialog", "text", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.checkbox
    tier: B
    argv: ["termux-dialog", "checkbox", "-t", "{{.title}}", "-v", "{{.values}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
      - {name: values, flag: -v, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.counter
    tier: B
    argv: ["termux-dialog", "counter", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.date
    tier: B
    argv: ["termux-dialog", "date", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.radio
    tier: B
    argv: ["termux-dialog", "radio", "-t", "{{.title}}", "-v", "{{.values}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
      - {name: values, flag: -v, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.sheet
    tier: B
    argv: ["termux-dialog", "sheet", "-t", "{{.title}}", "-v", "{{.values}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
      - {name: values, flag: -v, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.spinner
    tier: B
    argv: ["termux-dialog", "spinner", "-t", "{{.title}}", "-v", "{{.values}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
      - {name: values, flag: -v, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.speech
    tier: B
    argv: ["termux-dialog", "speech", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false

  - name: dialog.time
    tier: B
    argv: ["termux-dialog", "time", "-t", "{{.title}}"]
    args:
      - {name: title, flag: -t, type: string, required: false}
    timeout_s: 120
    parser: json
    watch: false
